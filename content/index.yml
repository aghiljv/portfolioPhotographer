faq:
  title: Frequently Asked Questions
  description: Answers to common questions about booking, production gear, and creative services.
  categories:
    - title: Services
      questions:
        - label: Where are you based and do you travel for shoots?
          content: |
            I’m based in the Augsburg area, Germany, and available for local, regional, and travel shoots across Europe.
        - label: What kind of media production do you offer?
          content: |
            I deliver end-to-end visual services—including commercial photography, promotional videos, event coverage, drone aerial footage, and cinematic short-form content for social platforms.
        - label: What is your creative style?
          content: |
            My visual style focuses on intentional composition, clean color science, natural lighting, and purposeful movement. I aim to create imagery that feels grounded, expressive, and high-end.
    - title: Technical & Gear
      questions:
        - label: What camera and gear setup do you use?
          content: |
            My core production kit includes a full-frame Panasonic Lumix S5II camera body, Lumix 20-60mm and Sigma 60-600mm lenses, a DJI RS 4 Mini gimbal, fluid-head tripods, studio lights, and a DJI Air 3S drone.
        - label: Do you offer certified drone footage?
          content: |
            Yes. I operate under the EU A1/A3 drone certification guidelines using a DJI Air 3S for high-resolution aerial photo and 4K video coverage, adhering strictly to local airspace regulations.
        - label: Do you handle editing and post-production?
          content: |
            Yes, I manage the complete workflow from raw shoot capture to post-production, including V-Log color grading, audio leveling, and formatting for horizontal (16:9) or vertical (9:16) delivery.
    - title: Outside Work
      questions:
        - label: What fuels your creative work outside of commercial shoots?
          content: |
            I’m passionate about landscape photography, cinematic film language, travel storytelling, reading, football, and exploring emerging media technology.
